name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain version
        run: moon version

      - name: Update MoonBit dependencies
        run: moon update

      - name: Type check (deny warnings)
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test (deny warnings)
        run: moon test --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Regenerate interface files
        run: moon info

      - name: Ensure interface files are up to date
        run: |
          if [ -n "$(git status --porcelain '*.mbti')" ]; then
            echo "::error::pkg.generated.mbti is out of date. Run 'moon info' and commit the result."
            git diff -- '*.mbti'
            exit 1
          fi
